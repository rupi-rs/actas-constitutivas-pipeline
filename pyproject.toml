[project]
name = "actas-pipeline"
version = "1.0.0"
description = "Corporate document automation pipeline for Mexican incorporation deeds (Actas Constitutivas) and amendments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "openai>=1.30",
    "rapidfuzz>=3.9",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "reportlab>=4.2",
    "pillow>=10.3",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
actas-cli = "src.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
